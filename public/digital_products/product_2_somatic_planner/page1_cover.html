<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Somatic Reset - Cover Page</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
    @page { size: 8.5in 11in; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 8.5in; height: 11in; background-color: #FBF9F5; color: #2D3748;
      font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column;
      justify-content: space-between; align-items: center; padding: 0.8in; position: relative;
    }
    .page-border { position: absolute; top: 0.4in; left: 0.4in; right: 0.4in; bottom: 0.4in; border: 1px solid rgba(118, 136, 117, 0.4); pointer-events: none; }
    .brand-badge { font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; color: #768875; font-weight: 600; margin-top: 0.4in; }
    .title-box { text-align: center; max-width: 6.5in; margin-top: 0.2in; }
    .main-title { font-family: 'Cormorant Garamond', serif; font-size: 3.4rem; font-weight: 700; letter-spacing: 0.04em; color: #2D3748; line-height: 1.1; text-transform: uppercase; }
    .subtitle { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.35rem; color: #C87D55; margin-top: 0.8rem; line-height: 1.4; }
    .illustration-box { margin: 0.4in 0; display: flex; justify-content: center; align-items: center; }
    .illustration-box svg { width: 220px; height: 220px; }
    .cover-footer { text-align: center; margin-bottom: 0.4in; }
    .author-name { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; letter-spacing: 0.08em; color: #2D3748; font-weight: 600; }
    .website-link { font-size: 0.75rem; letter-spacing: 0.15em; color: #768875; text-transform: uppercase; margin-top: 0.3rem; }
  </style>
</head>
<body>
  <div class="page-border"></div>
  <div class="brand-badge">Wander with Akhi</div>
  <div class="title-box">
    <h1 class="main-title">The Somatic Reset</h1>
    <p class="subtitle">A Mind-Body Wellness Journal for Nervous System Regulation & Burnout Recovery</p>
  </div>
  <div class="illustration-box">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="85" stroke="#768875" stroke-opacity="0.3" stroke-width="1.5"/>
      <path d="M100 30 C130 60 160 100 100 170 C40 100 70 60 100 30 Z" fill="#C87D55" fill-opacity="0.15" stroke="#C87D55" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="35" fill="#768875" fill-opacity="0.2"/>
    </svg>
  </div>
  <div class="cover-footer">
    <div class="author-name">Akhilesh Gowda</div>
    <div class="website-link">wanderwithakhi.com</div>
  </div>
</body>
</html>
