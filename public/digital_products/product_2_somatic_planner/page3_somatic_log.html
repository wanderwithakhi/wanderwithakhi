<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Somatic Reset - Daily Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
    @page { size: 8.5in 11in; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 8.5in; height: 11in; background-color: #FBF9F5; color: #2D3748; font-family: 'Plus Jakarta Sans', sans-serif; padding: 0.6in 0.7in; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(118, 136, 117, 0.4); padding-bottom: 0.3rem; margin-bottom: 1.2rem; }
    .header-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: #768875; font-weight: 600; }
    .page-number { font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; color: #C87D55; font-weight: 600; }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.8rem; background: #FFFFFF; border: 1px solid rgba(118, 136, 117, 0.3); padding: 0.6rem 0.8rem; border-radius: 4px; font-size: 0.8rem; margin-bottom: 1.2rem; }
    .section-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: #C87D55; font-weight: 700; margin: 1rem 0 0.4rem 0; border-bottom: 1px solid rgba(200, 125, 85, 0.2); padding-bottom: 0.2rem; }
    .box { border: 1px solid rgba(118, 136, 117, 0.35); background-color: #FFFFFF; border-radius: 4px; padding: 0.6rem; font-size: 0.85rem; }
    .writing-lines { background-image: repeating-linear-gradient(transparent, transparent 23px, rgba(118, 136, 117, 0.2) 24px); line-height: 24px; }
  </style>
</head>
<body>
  <div class="header-bar">
    <span class="header-title">Daily Somatic Tracker</span>
    <span class="page-number">Page 03</span>
  </div>

  <div class="meta-grid">
    <div><strong>Date:</strong> ____________</div>
    <div><strong>Sleep Quality:</strong> ⭐⭐⭐⭐⭐</div>
    <div><strong>Vagal State:</strong> Ventral / Symp / Dorsal</div>
  </div>

  <h3 class="section-title">01. Morning Body Scan (Sensations & Tightness)</h3>
  <div class="box writing-lines" style="min-height: 1.2in;"></div>

  <h3 class="section-title">02. Constructive Rest Pose (CRP) & Grounding Log</h3>
  <div class="box writing-lines" style="min-height: 1.2in;"></div>

  <h3 class="section-title">03. Evening Nervous System Decompression</h3>
  <div class="box writing-lines" style="min-height: 1.4in;"></div>
</body>
</html>
