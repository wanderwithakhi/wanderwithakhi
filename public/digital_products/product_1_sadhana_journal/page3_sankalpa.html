<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sadhana Journal - Page 3: My Sankalpa</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
    
    @page { size: 8.5in 11in; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 8.5in;
      height: 11in;
      background-color: #FBF9F5;
      color: #2D3748;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 0.7in 0.8in;
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(118, 136, 117, 0.4);
      padding-bottom: 0.3rem;
      margin-bottom: 1.5rem;
    }
    .header-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: #768875; font-weight: 600; }
    .page-number { font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; color: #C87D55; font-weight: 600; }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      color: #2D3748;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .section-subtitle {
      font-size: 0.88rem;
      color: #768875;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #C87D55;
      margin-bottom: 0.4rem;
      display: block;
    }

    .input-box {
      width: 100%;
      border: 1px solid rgba(118, 136, 117, 0.35);
      background-color: #FFFFFF;
      border-radius: 4px;
      padding: 0.8rem;
      min-height: 1.2in;
      position: relative;
    }

    .writing-lines {
      background-image: repeating-linear-gradient(transparent, transparent 27px, rgba(118, 136, 117, 0.2) 28px);
      line-height: 28px;
      min-height: 1.2in;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      background: #FFFFFF;
      border: 1px solid rgba(118, 136, 117, 0.35);
      padding: 1rem;
      border-radius: 4px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      font-size: 0.85rem;
      color: #2D3748;
    }
    .checkbox-item span {
      width: 16px;
      height: 16px;
      border: 1.5px solid #768875;
      border-radius: 3px;
      margin-right: 0.5rem;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <span class="header-title">The Daily Sadhana & Asana Journal</span>
    <span class="page-number">Page 03</span>
  </div>

  <h2 class="section-title">My Sankalpa (Spiritual Intention)</h2>
  <p class="section-subtitle">A Sankalpa is a vow formed in the heart to guide your practice over the next 30 to 90 days.</p>

  <div class="form-group">
    <label class="form-label">01. My Core Intention Statement</label>
    <div class="input-box writing-lines"></div>
  </div>

  <div class="form-group">
    <label class="form-label">02. Why This Intention Matters to Me Deeply</label>
    <div class="input-box writing-lines"></div>
  </div>

  <div class="form-group">
    <label class="form-label">03. Inner Qualities I Am Cultivating</label>
    <div class="checkbox-grid">
      <div class="checkbox-item"><span></span> Grounded Patience</div>
      <div class="checkbox-item"><span></span> Breath Awareness</div>
      <div class="checkbox-item"><span></span> Loving Discipline</div>
      <div class="checkbox-item"><span></span> Physical Surrender</div>
      <div class="checkbox-item"><span></span> Mental Stillness</div>
      <div class="checkbox-item"><span></span> Self-Compassion</div>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">04. Habits & Distractions I Am Releasing</label>
    <div class="input-box writing-lines" style="min-height: 0.8in;"></div>
  </div>

</body>
</html>
